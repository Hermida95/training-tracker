# Despliegue automático: cada push a main pasa los tests y, si van en verde,
# construye las dos imágenes, las sube a Artifact Registry y despliega ambos
# servicios de Cloud Run. Las migraciones de BD se aplican solas al arrancar
# el contenedor de la API (CMD alembic upgrade head).
#
# Autenticación SIN claves: Workload Identity Federation (ver
# infra/terraform/cicd.tf). Secrets necesarios en GitHub → Settings →
# Secrets and variables → Actions (los valores salen de `terraform output`):
#   GCP_PROJECT_ID    id del proyecto
#   GCP_REGION        ej. europe-southwest1
#   GCP_WIF_PROVIDER  output workload_identity_provider
#   GCP_DEPLOY_SA     output deploy_service_account
#   VITE_API_BASE_URL URL de la API + /api/v1 (output api_url)

name: Deploy

on:
  push:
    branches: [main]
    # Cambiar solo documentación no debe redesplegar la app.
    paths-ignore:
      - "**.md"
      - "LICENSE"

# Si haces dos push seguidos, el segundo espera al primero (no se pisan
# desplegando a la vez revisiones desordenadas).
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write # imprescindible: permite al workflow pedir el token OIDC a GitHub

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements*.txt

      - name: Backend tests
        working-directory: backend
        env:
          DATABASE_URL: sqlite:///./test.db
          ENVIRONMENT: test
        run: |
          pip install -r requirements.txt -r requirements-dev.txt
          ruff check .
          pytest -q

      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend build
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm run build

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v5

      # Intercambia el token OIDC de GitHub por credenciales temporales de la
      # service account de deploy (~1h de vida). No hay claves guardadas.
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SA }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Docker login en Artifact Registry
        run: gcloud auth configure-docker ${{ secrets.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Build & push API
        env:
          IMAGE: ${{ secrets.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/training-tracker/api
        run: |
          docker build backend --target production -t "$IMAGE:${{ github.sha }}" -t "$IMAGE:latest"
          docker push --all-tags "$IMAGE"

      - name: Build & push Front
        env:
          IMAGE: ${{ secrets.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/training-tracker/front
        run: |
          docker build frontend --target production \
            --build-arg VITE_API_BASE_URL="${{ secrets.VITE_API_BASE_URL }}" \
            -t "$IMAGE:${{ github.sha }}" -t "$IMAGE:latest"
          docker push --all-tags "$IMAGE"

      # Desplegamos el tag del commit (no :latest): cada revisión de Cloud Run
      # queda ligada a un commit exacto, y un rollback es re-desplegar el tag
      # anterior desde la consola o con gcloud.
      - name: Deploy API
        run: |
          gcloud run deploy training-tracker-api \
            --image "${{ secrets.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/training-tracker/api:${{ github.sha }}" \
            --region "${{ secrets.GCP_REGION }}" \
            --project "${{ secrets.GCP_PROJECT_ID }}" \
            --quiet

      - name: Deploy Front
        run: |
          gcloud run deploy training-tracker-front \
            --image "${{ secrets.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/training-tracker/front:${{ github.sha }}" \
            --region "${{ secrets.GCP_REGION }}" \
            --project "${{ secrets.GCP_PROJECT_ID }}" \
            --quiet

      - name: Smoke test
        run: |
          API_URL=$(gcloud run services describe training-tracker-api \
            --region "${{ secrets.GCP_REGION }}" --project "${{ secrets.GCP_PROJECT_ID }}" \
            --format 'value(status.url)')
          curl --fail --silent --show-error --retry 5 --retry-delay 3 "$API_URL/health"

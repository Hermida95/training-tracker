# Cloud Run inyecta PORT como variable de entorno; la imagen oficial de nginx
# procesa las plantillas en /etc/nginx/templates con envsubst, pero para
# mantenerlo simple usamos "listen 8080" fijo (coincide con el ENV PORT=8080
# del Dockerfile) en vez de montar el mecanismo de templates.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # gzip para los assets de Vite (JS/CSS ya vienen hasheados y cacheables).
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # El manifest y el service worker deben poder refrescarse sin caché larga:
    # si desplegamos una versión nueva del SW, el navegador debe verla pronto.
    location = /sw.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Assets con hash en el nombre (Vite): cacheables agresivamente.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA fallback: cualquier ruta que no sea un archivo real la resuelve
    # React Router del lado del cliente.
    location / {
        try_files $uri $uri/ /index.html;
    }
}

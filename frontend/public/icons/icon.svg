<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <rect width="512" height="512" rx="96" fill="#14110d"/>
  <!-- pico: triángulo sólido en naranja señal, con una facet interior para dar volumen -->
  <path d="M256 118 L412 400 L100 400 Z" fill="#ff4d26"/>
  <path d="M256 118 L330 268 L246 268 Z" fill="#14110d" fill-opacity="0.16"/>
  <!-- sendero: línea en zigzag ascendiendo hasta la cumbre -->
  <path d="M126 400 L182 336 L150 292 L214 232 L182 190 L256 118"
        fill="none" stroke="#f2ece0" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- marca de cumbre -->
  <circle cx="256" cy="118" r="17" fill="#f2ece0"/>
</svg>
